<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Cybelle Martins, full stack em formação: Java, Spring Boot e JavaScript. Céu azul-escuro com estrelas coloridas e uma constelação ligando um computador, um livro, um capelo de estudante e um violão.">
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/>
    <stop offset=".55" stop-color="#0a1633"/>
    <stop offset="1" stop-color="#0f1f4d"/>
  </linearGradient>
  <radialGradient id="nebulosa1" cx=".78" cy=".45" r=".45">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".28"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nebulosa2" cx=".12" cy=".9" r=".5">
    <stop offset="0" stop-color="#0891b2" stop-opacity=".22"/>
    <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="traco" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <linearGradient id="letra" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <linearGradient id="cadente" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <path id="estrela" d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4 Z"/>
  <clipPath id="moldura"><rect width="1000" height="280" rx="20"/></clipPath>
</defs>
<style>
  .ola { font-family: Consolas, 'Courier New', monospace; font-size: 17px; fill: #22d3ee; }
  .nome { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 58px; font-weight: 700; fill: url(#letra); letter-spacing: -.5px; }
  .sub { font-family: Consolas, 'Courier New', monospace; font-size: 16px; fill: #94a3b8; }
  .tag { font-family: Consolas, 'Courier New', monospace; font-size: 13px; fill: #cbd5e1; }
  .icone { fill: none; stroke: url(#traco); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ligacao { stroke: #6366f1; stroke-width: 1; stroke-dasharray: 3 5; opacity: .55; }
  .pisca { transform-box: fill-box; transform-origin: center; animation: pisca 3s ease-in-out infinite; }
  .p2 { animation-delay: .7s; } .p3 { animation-delay: 1.4s; } .p4 { animation-delay: 2.1s; }
  @keyframes pisca { 0%, 100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
  .cursor { animation: cursor 1.1s steps(1) infinite; }
  @keyframes cursor { 50% { opacity: 0; } }
  .cadente { animation: cai 7s ease-in infinite; opacity: 0; }
  @keyframes cai {
    0%, 70% { opacity: 0; transform: translate(0, 0); }
    74% { opacity: 1; }
    86% { opacity: 0; transform: translate(260px, 90px); }
    100% { opacity: 0; transform: translate(260px, 90px); }
  }
  .flutua { animation: flutua 6s ease-in-out infinite; }
  .f2 { animation-delay: 1.5s; } .f3 { animation-delay: 3s; } .f4 { animation-delay: 4.5s; }
  @keyframes flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
</style>

<g clip-path="url(#moldura)">
  <rect width="1000" height="280" fill="url(#ceu)"/>
  <rect width="1000" height="280" fill="url(#nebulosa1)"/>
  <rect width="1000" height="280" fill="url(#nebulosa2)"/>

  <!-- Poeira de estrelas -->
  <g fill="#e2e8f0" opacity=".55">
    <circle cx="40" cy="30" r=".9"/><circle cx="120" cy="250" r="1"/><circle cx="210" cy="36" r=".8"/>
    <circle cx="300" cy="240" r="1.1"/><circle cx="380" cy="24" r=".9"/><circle cx="455" cy="252" r=".8"/>
    <circle cx="520" cy="44" r="1"/><circle cx="560" cy="230" r=".9"/><circle cx="610" cy="20" r=".8"/>
    <circle cx="700" cy="258" r="1"/><circle cx="760" cy="30" r=".9"/><circle cx="880" cy="22" r="1.1"/>
    <circle cx="960" cy="250" r=".9"/><circle cx="980" cy="70" r=".8"/><circle cx="15" cy="150" r=".9"/>
    <circle cx="470" cy="140" r=".7"/><circle cx="830" cy="250" r=".8"/><circle cx="250" cy="130" r=".7"/>
  </g>

  <!-- Estrelas coloridas -->
  <g transform="translate(30,70) scale(.9)"><use href="#estrela" class="pisca" fill="#f472b6"/></g>
  <g transform="translate(170,36) scale(.7)"><use href="#estrela" class="pisca p2" fill="#facc15"/></g>
  <g transform="translate(342,232) scale(.8)"><use href="#estrela" class="pisca p3" fill="#22d3ee"/></g>
  <g transform="translate(470,52) scale(1)"><use href="#estrela" class="pisca p4" fill="#a78bfa"/></g>
  <g transform="translate(540,206) scale(.7)"><use href="#estrela" class="pisca" fill="#34d399"/></g>
  <g transform="translate(575,92) scale(.6)"><use href="#estrela" class="pisca p2" fill="#fb923c"/></g>
  <g transform="translate(965,38) scale(.9)"><use href="#estrela" class="pisca p3" fill="#f472b6"/></g>
  <g transform="translate(975,200) scale(.7)"><use href="#estrela" class="pisca p4" fill="#facc15"/></g>
  <g transform="translate(700,30) scale(.6)"><use href="#estrela" class="pisca" fill="#22d3ee"/></g>
  <g transform="translate(220,250) scale(.6)"><use href="#estrela" class="pisca p3" fill="#a78bfa"/></g>
  <g transform="translate(410,170) scale(.5)"><use href="#estrela" class="pisca p2" fill="#34d399"/></g>

  <!-- Estrela cadente -->
  <g class="cadente"><rect x="560" y="40" width="70" height="1.6" rx=".8" fill="url(#cadente)" transform="rotate(19 630 41)"/></g>

  <!-- Texto -->
  <text class="ola" x="64" y="96">&gt; olá, eu sou<tspan class="cursor" fill="#22d3ee"> ▌</tspan></text>
  <text class="nome" x="60" y="152">Cybelle Martins</text>
  <text class="sub" x="64" y="186">full stack em formação</text>
  <g class="tag">
    <rect x="64" y="204" width="56" height="24" rx="12" fill="#1e293b" stroke="#22d3ee" stroke-opacity=".5"/>
    <text x="92" y="220" text-anchor="middle">java</text>
    <rect x="128" y="204" width="104" height="24" rx="12" fill="#1e293b" stroke="#34d399" stroke-opacity=".5"/>
    <text x="180" y="220" text-anchor="middle">spring boot</text>
    <rect x="240" y="204" width="98" height="24" rx="12" fill="#1e293b" stroke="#facc15" stroke-opacity=".5"/>
    <text x="289" y="220" text-anchor="middle">javascript</text>
    <rect x="346" y="204" width="94" height="24" rx="12" fill="#1e293b" stroke="#f472b6" stroke-opacity=".5"/>
    <text x="393" y="220" text-anchor="middle">postgresql</text>
  </g>

  <!-- Constelação: computador, livro, estudo, violão -->
  <g class="ligacao">
    <line x1="660" y1="100" x2="790" y2="72"/>
    <line x1="790" y1="72" x2="905" y2="130"/>
    <line x1="905" y1="130" x2="770" y2="200"/>
    <line x1="770" y1="200" x2="660" y2="100"/>
  </g>

  <g filter="url(#brilho)">
    <!-- Computador -->
    <g class="flutua"><g transform="translate(660,100)" class="icone">
      <rect x="-30" y="-24" width="60" height="38" rx="4"/>
      <path d="M-38,20 L38,20 L33,27 L-33,27 Z"/>
      <path d="M-10,-11 L-17,-4 L-10,3 M10,-11 L17,-4 L10,3 M4,-13 L-4,5"/>
    </g></g>

    <!-- Livro aberto -->
    <g class="flutua f2"><g transform="translate(790,72)" class="icone">
      <path d="M0,-12 C-10,-19 -24,-19 -33,-15 L-33,19 C-24,15 -10,15 0,21 C10,15 24,15 33,19 L33,-15 C24,-19 10,-19 0,-12 Z"/>
      <path d="M0,-12 L0,21"/>
      <path d="M-25,-7 L-8,-6 M-25,0 L-8,1 M-25,7 L-8,8 M8,-6 L25,-7 M8,1 L25,0"/>
    </g></g>

    <!-- Capelo de estudante -->
    <g class="flutua f3"><g transform="translate(770,200)" class="icone">
      <path d="M0,-16 L36,-3 L0,10 L-36,-3 Z"/>
      <path d="M-20,3 L-20,15 C-11,22 11,22 20,15 L20,3"/>
      <path d="M36,-3 L36,14"/>
      <circle cx="36" cy="17" r="2.5"/>
    </g></g>

    <!-- Violão -->
    <g class="flutua f4"><g transform="translate(905,130) rotate(-24) scale(.5)" class="icone" style="stroke-width:4.2">
      <path d="M0,-60 C30,-60 42,-45 40,-25 C38,-8 28,0 30,12 C33,28 62,38 62,75 C62,110 35,128 0,128 C-35,128 -62,110 -62,75 C-62,38 -33,28 -30,12 C-28,0 -38,-8 -40,-25 C-42,-45 -30,-60 0,-60 Z"/>
      <circle cx="0" cy="22" r="15"/>
      <path d="M-7,-58 L-7,-192 L7,-192 L7,-58"/>
      <path d="M-9,-192 L-12,-230 Q0,-240 12,-230 L9,-192"/>
      <path d="M-22,92 L22,92"/>
      <path d="M-3,-190 L-3,90 M3,-190 L3,90" style="stroke-width:1.6"/>
    </g></g>
  </g>

  <!-- Nós da constelação -->
  <g>
    <g transform="translate(725,86) scale(.7)"><use href="#estrela" class="pisca" fill="#facc15"/></g>
    <g transform="translate(848,101) scale(.7)"><use href="#estrela" class="pisca p2" fill="#f472b6"/></g>
    <g transform="translate(838,165) scale(.7)"><use href="#estrela" class="pisca p3" fill="#34d399"/></g>
    <g transform="translate(715,150) scale(.7)"><use href="#estrela" class="pisca p4" fill="#22d3ee"/></g>
  </g>
</g>
</svg>
