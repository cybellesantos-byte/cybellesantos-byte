<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-label="Constelação do que já sei: Java, Spring Boot, Spring Security, APIs REST, JUnit e Mockito, PostgreSQL, Flyway, HTML e CSS, Bootstrap e JavaScript, todas ligadas. Chegando perto, aprendendo agora: React. Lá longe, no horizonte: TypeScript. Aberta a estágio.">
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030712"/>
    <stop offset=".55" stop-color="#0a1633"/>
    <stop offset="1" stop-color="#0f1f4d"/>
  </linearGradient>
  <radialGradient id="nebulosa" cx=".3" cy=".5" r=".45">
    <stop offset="0" stop-color="#4f46e5" stop-opacity=".22"/>
    <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
  </radialGradient>
  <filter id="brilho" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <path id="estrela" d="M0,-9 L2.1,-2.1 L9,0 L2.1,2.1 L0,9 L-2.1,2.1 L-9,0 L-2.1,-2.1 Z"/>
  <clipPath id="moldura"><rect width="800" height="320" rx="18"/></clipPath>
</defs>
<style>
  .rot { font-family: Consolas, 'Courier New', monospace; font-size: 14px; fill: #e2e8f0; }
  .zona { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
  .linha { stroke: #818cf8; stroke-width: 1.4; opacity: .7; }
  .cintila { transform-box: fill-box; transform-origin: center; animation: cintila 3.2s ease-in-out infinite; }
  .c1 { animation-delay: .5s; } .c2 { animation-delay: 1s; } .c3 { animation-delay: 1.6s; } .c4 { animation-delay: 2.2s; } .c5 { animation-delay: 2.7s; }
  @keyframes cintila { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(.85); } }
  .chega { animation: chega 3.6s ease-in-out infinite; }
  @keyframes chega { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-12px); } }
  .ponte { stroke: #67e8f9; stroke-width: 1.4; stroke-dasharray: 4 6; animation: corre 1.2s linear infinite; }
  @keyframes corre { to { stroke-dashoffset: -20; } }
  .onda { transform-box: fill-box; transform-origin: center; animation: onda 2s ease-out infinite; }
  @keyframes onda { from { opacity: .8; transform: scale(.5); } to { opacity: 0; transform: scale(2.2); } }
  .longe { transform-box: fill-box; transform-origin: center; animation: longe 4s ease-in-out infinite; }
  .l2 { animation-delay: 1.3s; } .l3 { animation-delay: 2.6s; }
  @keyframes longe { 0%, 100% { opacity: .25; } 50% { opacity: .7; } }
  .pulso { transform-box: fill-box; transform-origin: center; animation: pulso 1.6s ease-out infinite; }
  @keyframes pulso { from { opacity: .7; transform: scale(1); } to { opacity: 0; transform: scale(2.8); } }
</style>

<g clip-path="url(#moldura)">
  <rect width="800" height="320" fill="url(#ceu)"/>
  <rect width="800" height="320" fill="url(#nebulosa)"/>
  <g fill="#e2e8f0" opacity=".4">
    <circle cx="30" cy="40" r=".9"/><circle cx="220" cy="20" r=".8"/><circle cx="360" cy="300" r="1"/>
    <circle cx="560" cy="40" r=".9"/><circle cx="600" cy="290" r=".8"/><circle cx="780" cy="160" r="1"/>
    <circle cx="20" cy="270" r=".8"/><circle cx="520" cy="250" r=".7"/><circle cx="680" cy="230" r=".8"/>
  </g>

  <!-- ===== O que já sei: a constelação ===== -->
  <g class="linha">
    <line x1="80" y1="140" x2="170" y2="80"/>
    <line x1="80" y1="140" x2="140" y2="220"/>
    <line x1="170" y1="80" x2="260" y2="150"/>
    <line x1="140" y1="220" x2="260" y2="150"/>
    <line x1="260" y1="150" x2="270" y2="245"/>
    <line x1="270" y1="245" x2="390" y2="265"/>
    <line x1="170" y1="80" x2="310" y2="60"/>
    <line x1="310" y1="60" x2="400" y2="110"/>
    <line x1="400" y1="110" x2="470" y2="55"/>
    <line x1="400" y1="110" x2="470" y2="180"/>
    <line x1="260" y1="150" x2="470" y2="180"/>
  </g>
  <g filter="url(#brilho)">
    <g transform="translate(80,140) scale(1.5)"><use href="#estrela" class="cintila" fill="#facc15"/></g>
    <g transform="translate(170,80) scale(1.3)"><use href="#estrela" class="cintila c1" fill="#34d399"/></g>
    <g transform="translate(140,220) scale(1.2)"><use href="#estrela" class="cintila c2" fill="#2dd4bf"/></g>
    <g transform="translate(260,150) scale(1.3)"><use href="#estrela" class="cintila c3" fill="#22d3ee"/></g>
    <g transform="translate(310,60) scale(1.2)"><use href="#estrela" class="cintila c4" fill="#f472b6"/></g>
    <g transform="translate(270,245) scale(1.3)"><use href="#estrela" class="cintila c5" fill="#60a5fa"/></g>
    <g transform="translate(390,265) scale(1.1)"><use href="#estrela" class="cintila c1" fill="#fb7185"/></g>
    <g transform="translate(400,110) scale(1.2)"><use href="#estrela" class="cintila c2" fill="#fb923c"/></g>
    <g transform="translate(470,55) scale(1.1)"><use href="#estrela" class="cintila c3" fill="#a78bfa"/></g>
    <g transform="translate(470,180) scale(1.4)"><use href="#estrela" class="cintila c4" fill="#fde047"/></g>
  </g>
  <text class="rot" x="80" y="172" text-anchor="middle">Java</text>
  <text class="rot" x="170" y="58" text-anchor="middle">Spring Boot</text>
  <text class="rot" x="140" y="250" text-anchor="middle">Spring Security</text>
  <text class="rot" x="244" y="155" text-anchor="end">APIs REST</text>
  <text class="rot" x="310" y="38" text-anchor="middle">JUnit + Mockito</text>
  <text class="rot" x="270" y="275" text-anchor="middle">PostgreSQL</text>
  <text class="rot" x="408" y="270">Flyway</text>
  <text class="rot" x="416" y="116">HTML + CSS</text>
  <text class="rot" x="470" y="33" text-anchor="middle">Bootstrap</text>
  <text class="rot" x="470" y="212" text-anchor="middle">JavaScript</text>
  <text class="zona" x="28" y="302" fill="#facc15">O QUE JÁ SEI</text>

  <!-- ===== Chegando: React, quase entrando na constelação ===== -->
  <line class="ponte" x1="486" y1="180" x2="586" y2="170"/>
  <g transform="translate(600,168)">
    <g class="chega">
      <circle class="onda" cx="0" cy="0" r="14" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
      <use href="#estrela" transform="scale(1.3)" fill="#67e8f9" filter="url(#brilho)"/>
      <text class="rot" x="0" y="34" text-anchor="middle" fill="#67e8f9">React</text>
    </g>
  </g>
  <text class="zona" x="600" y="230" text-anchor="middle" fill="#67e8f9">APRENDENDO AGORA</text>

  <!-- ===== No horizonte: o que pretendo aprender ===== -->
  <g transform="translate(730,70)"><use href="#estrela" class="longe" fill="#c4b5fd" transform="scale(.8)"/></g>
  <text class="rot" x="730" y="98" text-anchor="middle" fill="#a5b4fc" opacity=".75" style="font-size:13px">TypeScript</text>
  <g transform="translate(770,30)"><use href="#estrela" class="longe l2" fill="#c4b5fd" transform="scale(.45)"/></g>
  <g transform="translate(690,30)"><use href="#estrela" class="longe l3" fill="#c4b5fd" transform="scale(.4)"/></g>
  <text class="zona" x="730" y="124" text-anchor="middle" fill="#a5b4fc" opacity=".8">NO HORIZONTE</text>

  <!-- Status -->
  <g transform="translate(616,272)">
    <rect width="160" height="30" rx="15" fill="#052e2b" stroke="#34d399" stroke-opacity=".6"/>
    <circle class="pulso" cx="18" cy="15" r="5" fill="#34d399"/>
    <circle cx="18" cy="15" r="5" fill="#34d399"/>
    <text class="rot" x="31" y="20" fill="#34d399" style="font-size:13px;font-weight:700">aberta a estágio</text>
  </g>
</g>
</svg>
