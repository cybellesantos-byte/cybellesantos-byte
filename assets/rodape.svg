<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70" role="img" aria-label="Faixa de céu estrelado: obrigada pela visita">
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0f1f4d"/>
    <stop offset=".5" stop-color="#0a1633"/>
    <stop offset="1" stop-color="#030712"/>
  </linearGradient>
  <path id="estrela" d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4 Z"/>
  <clipPath id="moldura"><rect width="1000" height="70" rx="16"/></clipPath>
</defs>
<style>
  .txt { font-family: Consolas, 'Courier New', monospace; font-size: 15px; fill: #cbd5e1; }
  .pisca { transform-box: fill-box; transform-origin: center; animation: pisca 3s ease-in-out infinite; }
  .p2 { animation-delay: .75s; } .p3 { animation-delay: 1.5s; } .p4 { animation-delay: 2.25s; }
  @keyframes pisca { 0%, 100% { opacity: .35; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
</style>
<g clip-path="url(#moldura)">
  <rect width="1000" height="70" fill="url(#ceu)"/>
  <g fill="#e2e8f0" opacity=".5">
    <circle cx="60" cy="18" r=".9"/><circle cx="170" cy="54" r="1"/><circle cx="300" cy="14" r=".8"/>
    <circle cx="690" cy="56" r=".9"/><circle cx="820" cy="16" r="1"/><circle cx="940" cy="52" r=".8"/>
  </g>
  <polyline points="90,40 160,24 230,44 300,30" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 5" opacity=".6"/>
  <polyline points="700,30 770,44 840,24 910,40" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="3 5" opacity=".6"/>
  <g transform="translate(90,40)"><use href="#estrela" class="pisca" fill="#22d3ee"/></g>
  <g transform="translate(160,24)"><use href="#estrela" class="pisca p2" fill="#facc15"/></g>
  <g transform="translate(230,44)"><use href="#estrela" class="pisca p3" fill="#f472b6"/></g>
  <g transform="translate(300,30)"><use href="#estrela" class="pisca p4" fill="#34d399"/></g>
  <g transform="translate(700,30)"><use href="#estrela" class="pisca p4" fill="#a78bfa"/></g>
  <g transform="translate(770,44)"><use href="#estrela" class="pisca p3" fill="#fb923c"/></g>
  <g transform="translate(840,24)"><use href="#estrela" class="pisca p2" fill="#22d3ee"/></g>
  <g transform="translate(910,40)"><use href="#estrela" class="pisca" fill="#f472b6"/></g>
  <text class="txt" x="500" y="40" text-anchor="middle">obrigada pela visita <tspan fill="#facc15">✦</tspan></text>
</g>
</svg>
